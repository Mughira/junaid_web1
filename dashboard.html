<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingship Concierge - Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#C9A84C;--gold-light:#E8C97A;--gold-dim:rgba(201,168,76,0.15);
  --dark:#0A0A0A;--dark2:#111111;--dark3:#1A1A1A;--dark4:#222222;
  --text:#E8E4DC;--text-dim:rgba(232,228,220,0.5);
  --border:rgba(201,168,76,0.2);
  --green:#4CAF50;--blue:#2196F3;--red:#e74c3c;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--dark);color:var(--text);min-height:100vh}

/* Header */
.header{background:var(--dark2);border-bottom:1px solid var(--border);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:22px;font-weight:300;letter-spacing:2px;color:var(--gold)}
.header h1 span{font-weight:600}
.header-right{display:flex;align-items:center;gap:12px}
.header-right .last-update{font-size:12px;color:var(--text-dim)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:24px 32px}
.stat-card{background:var(--dark2);border:1px solid var(--border);border-radius:12px;padding:20px 24px;text-align:center;transition:transform .2s,border-color .2s}
.stat-card:hover{transform:translateY(-2px);border-color:var(--gold)}
.stat-card .stat-value{font-size:36px;font-weight:700;color:var(--gold);line-height:1.2}
.stat-card .stat-label{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.stat-card.new-stat .stat-value{color:var(--gold-light)}
.stat-card.contacted-stat .stat-value{color:var(--blue)}
.stat-card.completed-stat .stat-value{color:var(--green)}

/* Toolbar */
.toolbar{padding:0 32px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:10px 16px 10px 40px;background:var(--dark2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--gold)}
.search-box input::placeholder{color:var(--text-dim)}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-dim)}
select{padding:10px 16px;background:var(--dark2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;cursor:pointer}
select:focus{border-color:var(--gold)}
.btn{padding:10px 20px;border:1px solid var(--border);border-radius:8px;background:var(--dark2);color:var(--text);font-size:14px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn-gold{background:var(--gold);color:var(--dark);border-color:var(--gold);font-weight:600}
.btn-gold:hover{background:var(--gold-light);color:var(--dark)}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}

/* Cards Grid */
.cards-container{padding:0 32px 32px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}

/* Contact Card */
.card{background:var(--dark2);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--gold);box-shadow:0 4px 24px rgba(201,168,76,0.08)}
.card-header{padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:flex-start}
.card-name{font-size:18px;font-weight:600;color:var(--text)}
.card-company{font-size:13px;color:var(--text-dim);margin-top:2px}
.card-status{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;cursor:pointer}
.card-status.new{background:var(--gold-dim);color:var(--gold)}
.card-status.contacted{background:rgba(33,150,243,0.15);color:var(--blue)}
.card-status.completed{background:rgba(76,175,80,0.15);color:var(--green)}

.card-body{padding:0 20px 16px}
.card-info{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.card-info-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-dim)}
.card-info-row svg{width:16px;height:16px;flex-shrink:0;color:var(--gold);opacity:.7}
.card-info-row .copy-btn{margin-left:auto;background:none;border:none;color:var(--text-dim);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:11px;opacity:0;transition:opacity .2s}
.card-info-row:hover .copy-btn{opacity:1}
.copy-btn:hover{color:var(--gold)}
.card-info-row span{color:var(--text)}

.service-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.service-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;background:var(--gold-dim);color:var(--gold);border:1px solid var(--border)}

.card-date{font-size:12px;color:var(--text-dim)}
.card-comm{font-size:12px;color:var(--text-dim);margin-top:4px}
.card-comm strong{color:var(--gold);font-weight:500}

/* Card Actions */
.card-actions{padding:12px 20px;border-top:1px solid rgba(201,168,76,0.1);display:flex;gap:8px;align-items:center}
.card-actions select{padding:6px 10px;font-size:12px;border-radius:6px}
.card-actions .btn{padding:6px 12px;font-size:12px}

/* Details Section */
.card-details{max-height:0;overflow:hidden;transition:max-height .3s ease}
.card-details.open{max-height:800px}
.card-details-inner{padding:0 20px 16px;border-top:1px solid rgba(201,168,76,0.1)}
.detail-section{margin-top:12px}
.detail-section h4{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:500}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.detail-item{font-size:13px}
.detail-item .label{color:var(--text-dim)}
.detail-item .value{color:var(--text);margin-left:4px}
.detail-notes{margin-top:12px;padding:12px;background:var(--dark3);border-radius:8px;font-size:13px;color:var(--text-dim);line-height:1.5}

/* Empty State */
.empty-state{text-align:center;padding:80px 32px;color:var(--text-dim)}
.empty-state svg{width:64px;height:64px;color:var(--border);margin-bottom:16px}
.empty-state h3{font-size:20px;font-weight:400;color:var(--text);margin-bottom:8px}
.empty-state p{font-size:14px}

/* Loading */
.loading{text-align:center;padding:40px;color:var(--text-dim);font-size:14px}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;background:var(--dark3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;transform:translateY(100px);opacity:0;transition:all .3s;z-index:200}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:var(--green)}
.toast.error{border-color:var(--red)}

/* Confirm Dialog */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;align-items:center;justify-content:center}
.overlay.show{display:flex}
.confirm-dialog{background:var(--dark2);border:1px solid var(--border);border-radius:12px;padding:28px;max-width:380px;text-align:center}
.confirm-dialog h3{font-size:18px;margin-bottom:8px}
.confirm-dialog p{font-size:14px;color:var(--text-dim);margin-bottom:20px}
.confirm-dialog .btns{display:flex;gap:12px;justify-content:center}

/* Payment Dialog */
.payment-dialog{background:var(--dark2);border:1px solid var(--border);border-radius:12px;padding:32px;max-width:420px;width:90%}
.payment-dialog h3{font-size:18px;margin-bottom:4px;color:var(--text)}
.payment-dialog .pay-subtitle{font-size:13px;color:var(--text-dim);margin-bottom:20px}
.payment-dialog .pay-to{font-size:14px;color:var(--gold);margin-bottom:20px;padding:12px;background:var(--dark3);border-radius:8px;display:flex;align-items:center;gap:10px}
.payment-dialog .pay-to .pay-name{font-weight:600;color:var(--text)}
.payment-dialog .pay-to .pay-email{font-size:12px;color:var(--text-dim)}
.pay-field{margin-bottom:16px}
.pay-field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.pay-field input,.pay-field textarea{width:100%;padding:12px 16px;background:var(--dark3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;outline:none;transition:border-color .2s;font-family:inherit}
.pay-field input:focus,.pay-field textarea:focus{border-color:var(--gold)}
.pay-field input::placeholder,.pay-field textarea::placeholder{color:var(--text-dim)}
.pay-field .amount-input{position:relative}
.pay-field .amount-input span{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:18px;font-weight:600}
.pay-field .amount-input input{padding-left:32px;font-size:20px;font-weight:600}
.pay-field textarea{resize:vertical;min-height:60px;font-size:14px}
.payment-dialog .btns{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}
.btn-stripe{background:linear-gradient(135deg,#C9A84C,#E8C97A);color:var(--dark);border:none;font-weight:700;letter-spacing:.3px}
.btn-stripe:hover{background:linear-gradient(135deg,#E8C97A,#C9A84C);color:var(--dark)}
.btn-stripe:disabled{opacity:.5;cursor:not-allowed}

/* Responsive */
@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr);padding:16px}
  .toolbar{padding:0 16px 12px}
  .cards-container{padding:0 16px 16px}
  .cards-grid{grid-template-columns:1fr}
  .header{padding:16px}
}
@media(max-width:500px){
  .stats{grid-template-columns:1fr 1fr;gap:8px;padding:12px}
  .stat-card{padding:14px}
  .stat-card .stat-value{font-size:28px}
  .cards-grid{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="header">
  <h1><span>KINGSHIP</span> Concierge &mdash; Dashboard</h1>
  <div class="header-right">
    <span class="last-update" id="lastUpdate"></span>
    <button class="btn" onclick="fetchContacts()" title="Refresh">&#x21bb; Refresh</button>
  </div>
</div>

<div class="stats" id="statsBar">
  <div class="stat-card"><div class="stat-value" id="statTotal">-</div><div class="stat-label">Total Leads</div></div>
  <div class="stat-card new-stat"><div class="stat-value" id="statNew">-</div><div class="stat-label">New</div></div>
  <div class="stat-card contacted-stat"><div class="stat-value" id="statContacted">-</div><div class="stat-label">Contacted</div></div>
  <div class="stat-card completed-stat"><div class="stat-value" id="statCompleted">-</div><div class="stat-label">Completed</div></div>
</div>

<div class="toolbar">
  <div class="search-box">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    <input type="text" id="searchInput" placeholder="Search by name, email, phone, or company...">
  </div>
  <select id="serviceFilter">
    <option value="">All Services</option>
    <option value="chauffeur">Chauffeur</option>
    <option value="yacht">Yacht Charter</option>
    <option value="partybus">Party Bus</option>
  </select>
  <select id="statusFilter">
    <option value="">All Status</option>
    <option value="new">New</option>
    <option value="contacted">Contacted</option>
    <option value="completed">Completed</option>
  </select>
  <button class="btn" onclick="exportCSV()">&#x2913; Export CSV</button>
</div>

<div class="cards-container">
  <div id="cardsGrid" class="cards-grid">
    <div class="loading">Loading contacts...</div>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="confirm-dialog">
    <h3>Delete Contact</h3>
    <p id="confirmMsg">Are you sure you want to delete this contact?</p>
    <div class="btns">
      <button class="btn" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" id="confirmBtn" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="overlay" id="paymentOverlay">
  <div class="payment-dialog">
    <h3>Send Payment Link</h3>
    <p class="pay-subtitle">A Stripe payment link will be emailed to the customer</p>
    <div class="pay-to">
      <div>
        <div class="pay-name" id="payName"></div>
        <div class="pay-email" id="payEmail"></div>
      </div>
    </div>
    <div class="pay-field">
      <label>Amount (USD)</label>
      <div class="amount-input">
        <span>$</span>
        <input type="number" id="payAmount" placeholder="0.00" min="1" step="0.01">
      </div>
    </div>
    <div class="pay-field">
      <label>Description (optional)</label>
      <textarea id="payDescription" placeholder="e.g. Yacht Charter - March 15th"></textarea>
    </div>
    <div class="btns">
      <button class="btn" onclick="closePayment()">Cancel</button>
      <button class="btn" id="payCopyBtn" onclick="copyPaymentLink()">Copy Link</button>
      <button class="btn btn-stripe" id="paySubmitBtn" onclick="submitPayment()">Send &amp; Email</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let contacts = [];
let stats = { total: 0, new: 0, contacted: 0, completed: 0 };
let deleteId = null;
let refreshTimer = null;

const API = '/api/contacts';

async function fetchContacts() {
  try {
    const params = new URLSearchParams();
    const search = document.getElementById('searchInput').value.trim();
    const service = document.getElementById('serviceFilter').value;
    const status = document.getElementById('statusFilter').value;
    if (search) params.set('search', search);
    if (service) params.set('service', service);
    if (status) params.set('status', status);

    const url = API + (params.toString() ? '?' + params.toString() : '');
    const res = await fetch(url);
    const data = await res.json();
    contacts = data.contacts || [];
    stats = data.stats || stats;
    renderStats();
    renderCards();
    document.getElementById('lastUpdate').textContent = 'Updated: ' + new Date().toLocaleTimeString();
  } catch (err) {
    showToast('Failed to load contacts', 'error');
  }
}

function renderStats() {
  document.getElementById('statTotal').textContent = stats.total;
  document.getElementById('statNew').textContent = stats.new;
  document.getElementById('statContacted').textContent = stats.contacted;
  document.getElementById('statCompleted').textContent = stats.completed;
}

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  if (contacts.length === 0) {
    grid.innerHTML = '<div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg><h3>No contacts yet</h3><p>Form submissions will appear here</p></div>';
    return;
  }

  grid.innerHTML = contacts.map(c => {
    const services = (c.selectedServices || '').split(',').map(s => s.trim()).filter(Boolean);
    const fd = c.formData || {};
    const date = c.submittedAt ? new Date(c.submittedAt).toLocaleString() : '';

    return `<div class="card" id="card-${c.id}">
      <div class="card-header">
        <div>
          <div class="card-name">${esc(c.fullName)}</div>
          ${c.company ? `<div class="card-company">${esc(c.company)}</div>` : ''}
        </div>
        <span class="card-status ${c.status}">${c.status}</span>
      </div>
      <div class="card-body">
        <div class="card-info">
          <div class="card-info-row">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            <span>${esc(c.phone)}</span>
            <button class="copy-btn" onclick="copyText('${esc(c.phone)}')">Copy</button>
          </div>
          <div class="card-info-row">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            <span>${esc(c.email)}</span>
            <button class="copy-btn" onclick="copyText('${esc(c.email)}')">Copy</button>
          </div>
        </div>
        <div class="service-badges">${services.map(s => `<span class="service-badge">${esc(formatService(s))}</span>`).join('')}</div>
        <div class="card-date">${date}</div>
        ${c.commMethod ? `<div class="card-comm">Preferred: <strong>${esc(c.commMethod)}</strong></div>` : ''}
      </div>
      <div class="card-details" id="details-${c.id}">
        <div class="card-details-inner">
          ${buildDetails(fd, services)}
          ${fd.additionalNotes ? `<div class="detail-notes"><strong>Notes:</strong> ${esc(fd.additionalNotes)}</div>` : ''}
        </div>
      </div>
      <div class="card-actions">
        <button class="btn" onclick="toggleDetails(${c.id})">Details</button>
        <select onchange="updateStatus(${c.id}, this.value)" style="margin-left:auto">
          <option value="new" ${c.status==='new'?'selected':''}>New</option>
          <option value="contacted" ${c.status==='contacted'?'selected':''}>Contacted</option>
          <option value="completed" ${c.status==='completed'?'selected':''}>Completed</option>
        </select>
        <button class="btn btn-gold" onclick="openPayment(${c.id}, '${esc(c.fullName)}', '${esc(c.email)}')">$ Payment</button>
        <button class="btn btn-danger" onclick="askDelete(${c.id}, '${esc(c.fullName)}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

function buildDetails(fd, services) {
  let html = '';
  if (services.includes('chauffeur')) {
    html += `<div class="detail-section"><h4>Chauffeur Details</h4><div class="detail-grid">
      ${detailItem('Date', fd.c_date)}${detailItem('Time', fd.c_time)}
      ${detailItem('Pickup', fd.c_pickup)}${detailItem('Drop-off', fd.c_dropoff)}
      ${detailItem('Service Type', fd.c_serviceType)}${detailItem('Vehicle', fd.c_vehicle)}
      ${detailItem('Passengers', fd.c_pax)}${detailItem('Luggage', fd.c_luggage)}
      ${detailItem('Purpose', fd.c_purpose)}${detailItem('Extras', fd.c_extras)}
    </div></div>`;
  }
  if (services.includes('yacht')) {
    html += `<div class="detail-section"><h4>Yacht Charter Details</h4><div class="detail-grid">
      ${detailItem('Date', fd.y_date)}${detailItem('Time', fd.y_time)}
      ${detailItem('Duration', fd.y_duration)}${detailItem('Marina', fd.y_marina)}
      ${detailItem('Guests', fd.y_guests)}${detailItem('Occasion', fd.y_occasion)}
      ${detailItem('Yacht Size', fd.y_size)}${detailItem('Budget', fd.y_budget)}
      ${detailItem('Extras', fd.y_extras)}${detailItem('Theme', fd.y_theme)}
      ${detailItem('Dietary', fd.y_diet)}
    </div></div>`;
  }
  if (services.includes('partybus')) {
    html += `<div class="detail-section"><h4>Party Bus Details</h4><div class="detail-grid">
      ${detailItem('Date', fd.p_date)}${detailItem('Time', fd.p_time)}
      ${detailItem('Event Type', fd.p_eventType)}${detailItem('Pickup', fd.p_pickup)}
      ${detailItem('Drop-off', fd.p_dropoff)}${detailItem('Duration', fd.p_duration)}
      ${detailItem('Guests', fd.p_guests)}${detailItem('Age Group', fd.p_age)}
      ${detailItem('Bus Size', fd.p_busSize)}${detailItem('Extras', fd.p_extras)}
      ${detailItem('Extra Stops', fd.p_stops)}
    </div></div>`;
  }
  return html;
}

function detailItem(label, value) {
  if (!value) return '';
  return `<div class="detail-item"><span class="label">${label}:</span><span class="value">${esc(value)}</span></div>`;
}

function toggleDetails(id) {
  const el = document.getElementById('details-' + id);
  el.classList.toggle('open');
}

async function updateStatus(id, status) {
  try {
    const res = await fetch(API + '/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    if (!res.ok) throw new Error();
    showToast('Status updated');
    fetchContacts();
  } catch {
    showToast('Failed to update status', 'error');
  }
}

function askDelete(id, name) {
  deleteId = id;
  document.getElementById('confirmMsg').textContent = `Delete contact "${name}"? This cannot be undone.`;
  document.getElementById('confirmOverlay').classList.add('show');
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('show');
  deleteId = null;
}

async function confirmDelete() {
  if (!deleteId) return;
  closeConfirm();
  try {
    const res = await fetch(API + '/' + deleteId, { method: 'DELETE' });
    if (!res.ok) throw new Error();
    showToast('Contact deleted');
    fetchContacts();
  } catch {
    showToast('Failed to delete', 'error');
  }
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => {});
}

function exportCSV() {
  if (contacts.length === 0) return showToast('No contacts to export', 'error');
  const headers = ['ID','Name','Company','Phone','Email','Communication','Services','Status','Submitted','Notes'];
  const rows = contacts.map(c => [
    c.id, c.fullName, c.company, c.phone, c.email, c.commMethod,
    c.selectedServices, c.status, c.submittedAt, c.additionalNotes || (c.formData && c.formData.additionalNotes) || ''
  ]);
  let csv = headers.join(',') + '\n';
  rows.forEach(r => { csv += r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',') + '\n'; });
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kingship-contacts-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('CSV exported');
}

function formatService(s) {
  const map = { chauffeur: 'Chauffeur', yacht: 'Yacht Charter', partybus: 'Party Bus' };
  return map[s] || s;
}

function esc(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || 'success');
  setTimeout(() => t.className = 'toast', 2500);
}

// --- Payment ---
let payContactId = null;

function openPayment(id, name, email) {
  payContactId = id;
  document.getElementById('payName').textContent = name;
  document.getElementById('payEmail').textContent = email;
  document.getElementById('payAmount').value = '';
  document.getElementById('payDescription').value = '';
  document.getElementById('paySubmitBtn').disabled = false;
  document.getElementById('paySubmitBtn').textContent = 'Send Payment Link';
  document.getElementById('paymentOverlay').classList.add('show');
  setTimeout(() => document.getElementById('payAmount').focus(), 100);
}

function closePayment() {
  document.getElementById('paymentOverlay').classList.remove('show');
  payContactId = null;
}

async function submitPayment() {
  const amount = parseFloat(document.getElementById('payAmount').value);
  const description = document.getElementById('payDescription').value.trim();
  if (!amount || amount <= 0) return showToast('Enter a valid amount', 'error');

  const btn = document.getElementById('paySubmitBtn');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    const res = await fetch('/api/send-payment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactId: payContactId, amount, description })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    closePayment();
    showToast('Payment link sent to ' + document.getElementById('payEmail').textContent);
  } catch (err) {
    showToast(err.message || 'Failed to send payment link', 'error');
    btn.disabled = false;
    btn.textContent = 'Send Payment Link';
  }
}

async function copyPaymentLink() {
  const amount = parseFloat(document.getElementById('payAmount').value);
  const description = document.getElementById('payDescription').value.trim();
  if (!amount || amount <= 0) return showToast('Enter a valid amount', 'error');

  const btn = document.getElementById('payCopyBtn');
  btn.disabled = true;
  btn.textContent = 'Creating...';

  try {
    const res = await fetch('/api/create-payment-link', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactId: payContactId, amount, description })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    await navigator.clipboard.writeText(data.paymentUrl);
    closePayment();
    showToast('Payment link copied to clipboard!');
  } catch (err) {
    showToast(err.message || 'Failed to create payment link', 'error');
    btn.disabled = false;
    btn.textContent = 'Copy Link';
  }
}

// Close payment overlay on outside click
document.getElementById('paymentOverlay').addEventListener('click', function(e) {
  if (e.target === this) closePayment();
});

// Debounced search
let searchTimeout;
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(fetchContacts, 300);
});
document.getElementById('serviceFilter').addEventListener('change', fetchContacts);
document.getElementById('statusFilter').addEventListener('change', fetchContacts);

// Initial load & auto-refresh
fetchContacts();
refreshTimer = setInterval(fetchContacts, 30000);
</script>
